schema_version = 2

[board]
name = "instantnoodlep"
soc = "SM8250"
soc_source = "sm8250"
os_profile = "ipados-17.7.11-21H461"
description = "OnePlus 8 Pro IN2020: Qualcomm SM8250 (Snapdragon 865), Adreno 650, 8 GiB DRAM, 1080x2376 panel"
kit = "instantnoodlep"

[components]
# Official components plus our own A650 GPU backend (Adreno650) and the GOP display backend.
include = ["ArmDTPlatform", "ArmCpu", "SoftwareAES", "XnuPrelink", "DarwinBoot", "RamBlock", "GopFramebuffer"]

[kernel]
defconfig = "instantnoodlep_defconfig"
config_fragments = ["arch:configs/common.config", "soc:configs/sm8250.config", "os:configs/ipados.config"]
patch_series = ["arch:patches/xnu/series", "soc:patches/xnu/series", "device:patches/xnu/prereq-series", "os:patches/xnu/series", "device:patches/xnu/series"]
archives = [
  "build-corecrypto-14.py",
  "build-corecrypto-14.py --namespace",
  "component:ArmDTPlatform",
  "component:ArmCpu",
  "component:SoftwareAES",
  "build-software-aes-bindings.py",
  "build-mockfs-fixture.py",
  "build-libpthread-kernel.py",
  "build-sm8250-ufs.py",
  "component:RamBlock",
  "build-gop-legacy-display.py",
  "build-sm8250-a650.py"
]

[kernel.prelink]
kernel = "build/xnu/ios-obj/DEVELOPMENT_ARM64_BCM2837/mach.development.bcm2837.unstripped.noctf"
tool = "kits/XnuPrelink/emit_prelink.py"
kernelcache = ".cache/firmware/kernelcache.macho/kernelcache.release.ipad7.decompressed"
kernelcache_sha256 = "f18b4df865405f2a287b84977d7aca745e056d656d9fc9df1662970ce2969de7"
slide = "-16777216"
early_security_init = "com.apple.driver.AppleMobileFileIntegrity=0xfffffff005ab4ae0"
roots = [
  "com.apple.AppleFSCompression.AppleFSCompressionTypeZlib",
  "com.apple.driver.AppleARMPlatform",
  "com.apple.driver.AppleARMWatchdogTimer",
  "com.apple.driver.AppleAudioClockLibs",
  "com.apple.driver.AppleEffaceableStorage",
  "com.apple.driver.AppleIISController",
  "com.apple.driver.AppleM2ScalerCSCDriver",
  "com.apple.driver.AppleMobileFileIntegrity",
  "com.apple.driver.ApplePMGR",
  "com.apple.driver.IODARTFamily",
  "com.apple.filesystems.apfs",
  "com.apple.iokit.CoreAnalyticsFamily",
  "com.apple.iokit.IOAVFamily",
  "com.apple.iokit.IOAudio2Family",
  "com.apple.iokit.IOCECFamily",
  "com.apple.iokit.IOCryptoAcceleratorFamily",
  "com.apple.iokit.IOGPUFamily",
  "com.apple.iokit.IOHDCPFamily",
  "com.apple.iokit.IOHIDFamily",
  "com.apple.iokit.IOMobileGraphicsFamily",
  "com.apple.iokit.IOReportFamily",
  "com.apple.iokit.IOSlowAdaptiveClockingFamily",
  "com.apple.iokit.IOStorageFamily",
  "com.apple.iokit.IOSurface",
  "com.apple.kec.Libm",
  "com.apple.kec.corecrypto",
  "com.apple.kext.AppleMatch",
  "com.apple.kext.CoreTrust",
  "com.apple.security.AppleImage4",
  "com.apple.security.sandbox",
]

[device_tree]
source = "device:dts/instantnoodlep.dts"
include_dirs = ["soc:dts"]

[payload]
volume = "UNIXNU"
size_mib = 192
loader = "firmware"
title = "UniXNU"
kernel_args = ["-v", "serial=3", "debug=0x14e", "sheng-pmgr=2", "smgop=1", "sheng-vsync=60",
               "offline-legacy-gop=1", "offline-legacy-register=1", "offline-legacy-phase=4",
               "offline-legacy-pm=1", "offline-legacy-validate=1", "offline-legacy-transfer=1",
               "offline-legacy-retire=1", "offline-legacy-cpu-present=1",
               "sm8250-gpu-ro=1", "sm8250-gpu-alioth=12", "sheng-fb-gpu=1", "sheng-early-retire=1",
               "gpu-addon=1", "sheng-gpu-addon=1"]

[package]
unixnu = "../upstream-core"

[package.defconfig]
"ipados-17.7.11-21H461" = "instantnoodlep_defconfig"
