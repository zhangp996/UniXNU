"button-priority_hold" = 1
"button-priority_volup" = 2
"button-priority_voldown" = 2
"opposed-power-vol-buttons" = 1

["adt"."defaults"]

["adt"."defaults"."u32"]
# Measured from the d221ap /defaults node (kern.maxvnodes 10000), not the iPad's 66560.
"kern.maxvnodes" = 10000

["adt"."options"]

# SM8250 has no Apple PMGR and no SEP. AppleARMWatchdogTimer reads IODeviceTree:/options;
# with an empty node it infers defaults and arms the userspace watchdog, which watchdogd
# must feed from userspace. The R2 baseline already disables watchdogd at the boot-arg
# level (disable-watchdogd=1) and overrides the owner watchdog; these properties defang
# the kext-side watchdogs at the source so a boot that never reaches watchdogd does not
# reset after ~a minute. The d221ap /options node itself is empty; this is our adaptation.
["adt"."options"."u32"]
"defang_watchdogd" = 1
"IOKitQuiesceWatchdogEnabled" = 0
"PanicWatchdogEnabled" = 0
"ShutdownWatchdogEnabled" = 0

[userdata]
# Disk images of this OS, in window order; the device sets the partition geometry.
# OS = 087-86698-044.dmg (4,730,814,044 B), SystemOS = 087-86593-047.dmg (2,743,074,816 B).
windows = [{ name = "OS", component = "OS" }, { name = "SystemOS", component = "Cryptex1,SystemOS", optional = true }]

