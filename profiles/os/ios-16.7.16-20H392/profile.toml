["adt"."buttons"]

# Measured d221ap /buttons: names volup,voldown,hold,ringerab; home-button-type 2
# (no home button), opposed-power-vol-buttons 1, priorities hold 1 / volup,voldown 2.
["adt"."buttons"."string"]
