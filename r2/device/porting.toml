findings = ["Cold start: GPU: bring-up mode 12; seven windows mapped; power gcc=1 cc=1 smmu=1; GMU clocks step=5 failed=0; A650 cold start mode 12; metal register rc=0.", "Metal clients connect and keep running: GPUDIAG tick=440 opens=8 closed=4 calls=8300 ext entries=8555 tunnel=8301 probes=264 last_sel=6 last_status=0; openers SpringBoard/Setup/mediaserverd/WidgetRenderer_D and readers CollectionsPoster/MobileGestaltHelper are the expected render-server and app clients.", "All displayed frames use the 8-bit BGRA path (fmt=42475241, 402 frames); no 10-bit 30RGBLE_8A submissions.", "The driver already exposes the 16-method NativeAdreno client ABI (Query, BoAlloc/Map/Free/Import, Submit, WaitFence, GetTimestamp/Status, SetMetadata/GetMetadata, CreateQueue/CloseQueue, BoCpuMap/Unmap, GetDeviceInfo) plus tunnel (magic NTNL), mailbox and GOP handoff channels."]
