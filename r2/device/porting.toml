[[area]]
id = "gpu"
status = "in_progress"
components = ["Adreno650"]
paths = ["drivers/Adreno650/**", "package/Sm8250AliothCold.cpp", "package/Sm8250AliothMetal.cpp", "proprietary-files.txt"]
