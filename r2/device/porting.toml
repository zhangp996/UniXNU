[[area]]
id = "storage"
status = "host-verified"
components = ["ShengUfs", "VirtioMmioBlock", "VerifiedRoot"]
paths = ["board.toml", "configs/instantnoodlep_defconfig", "dts/**", "docs/evidence/2026-11-10-storage-route.md", "docs/evidence/2026-11-10-storage-table-build.md", "docs/evidence/2026-11-10-storage-link.md"]
inputs = ["UFS 3.0 host 1d84000, PHY 1d87000, ICE 1d90000.", "GPT userdata entry: first LBA 4133800, last LBA 30513146 (4 KiB LBA)."]
configuration = ["[userdata] first_lba/last_lba/lba_bytes and two windows (OS, SystemOS).", "include/ufs-soc-table.h in UniXNU-sm8250-common carries the controller facts; board.toml [kernel] archives names the storage components after the complete arm64 list.", "configs/instantnoodlep_defconfig enables CONFIG_XNU_NATIVE_UFS; the owner-policy variant stays off (CONFIG_XNU_VERIFIED_ROOT_PROBE unset).", "[payload] kernel_args adds native-ufs-root=1. dts/instantnoodlep.dts keeps the SoC description UFS nodes disabled: enabling them hung the kernel before its console (A/B in docs/evidence/2026-11-10-storage-link.md), and the driver does not need them."]
procedure = ["dd the GPT header with bs=4096 and parse the entry array at 0x2000.", "python3 ./unixnu tree|defconfig|build kernel -D ../UniXNU-instantnoodlep", "python3 scripts/patch-amfi-nopmgr.py kernel.macho; python3 ./unixnu build payload --kernel <patched> --unique-chip-id <seed> --trust-cache out/ipsw/21H461/trust.bundle; mkbootimg (kernel_small.bin + payload + stock dtb)."]
findings = ["Route chosen: the upstream ShengUfs component (catalog id ShengUfs, runtime class NativeUfs, source NativeUfs.cpp) with a kona table, not a board-local fork; the component is fetched at 99d8bcd3 and builds to build/sheng-ufs/libShengUfs.a.", "The delta from ShengUfs (SM8550) to this board is small: GccUfs.h already carries the GCC base 0x100000 and the host window 0x1d84000+0x3000 that kona uses, and the driver adopts the firmware's controller state instead of programming clocks and PHY itself.", "What differs: the match string is qcom,sm8250-ufshc; the GCC branch offsets are 0x77010/0x77018/0x7701C/0x77020/0x7705C/0x77064/0x7709C/0x770B8/0x770CC; the PHY is 0x1d87000+0xe00; core_reset is GCC id 0x21 with BCR at 0x77000; and the kona ufshc node carries no iommus, so there is no SMMU takeover.", "One component now serves both SoCs: scripts/unixnu/tree.py links the resolved SoC feed into the assembled tree as soc/, scripts/build-arm-driver.py adds -I <tree>/soc/include for a component whose catalog entry sets soc_headers, UniXNU-sm8250-common/include/ufs-soc-table.h holds the kona entry, and NativeUfs.cpp adopts the entry that names the node compatible, keeping the SM8550 values as the fallback.", "[kernel] archives is a replacing array: naming only the three storage components dropped corecrypto, the AES original-bindings archive, the mockfs fixture and libpthread from the link, which then fails on IOAESAccelerator. The list repeats the complete profiles/arch/arm64 order and appends the storage components.", "ShengUfs builds with -Werror and passes the arm64-apple-ios17.0 object audit; libShengUfs.a is sha256 1b6bce6ec2b709cd2b71a09931026f9ef652194a90c8914f7683ce5e6e61d2b3 (486920 bytes) and the object carries both qcom,sm8250-ufshc and qcom,sm8250.", "The kernel links with the driver once the storage family comes from the pinned prelink: the base vtable and the seven base methods the subclass repeats are absolute symbols for 21H461, derived from the original vtable by scripts/derive-storage-bindings.py and archived next to the driver. kernel.macho is sha256 82e653afbc0de677d5d3aa78ed17bfb9d10610728382b80040470aaf0b34538b.", "The owner-policy chain is compiled out (CONFIG_XNU_VERIFIED_ROOT_PROBE is off): the driver publishes the windows as an IOMedia without authenticating each block. The policy symbols need the signed OS/SystemOS policies and the userdata image, which this board has not built.", "The payload accepts the AMFI-patched kernel instead of sheng-pmgr=2 (scripts/unixnu/payload.py reads the recorded patch instruction at the call site). The ADT root compatible lists J120AP oneplus,instantnoodlep qcom,sm8250, which is what resolves the kona table entry at run time; the ADT also carries a build id, so its sha256 differs per build.", "bootZ.img (B bootZ) is sha256 cea799d1a77c2534b7dcc2e7a2eacb7497e152b8a92c8534421d542847b701a5, 107,507,712 bytes: BootShim + FD kernel_small.bin, this payload, the stock boot_a dtb", "A/B on the device (2026-11-10): enabling the UFS nodes in the board dts hung the kernel after the entry-probe bars with kernel a8c5d42b (bootZ4), while the same kernel with the nodes disabled and native-ufs-root=1 booted to the known root-mount panic (bootZ5). The driver is not involved; the nodes stay out of the ADT until the platform expert path is understood.", "KernelConfigTables.cpo takes its personalities from target-specific CFLAGS_ADD and make does not invalidate it when only those change: the first build without XNU_NATIVE_UFS left an object without the NativeUfs personalities, so several images force-loaded the driver with nothing pointing at it. build-xnu-4k-baseline.sh now stamps PERSONALITY_CFLAGS and removes the object when the set changes.", "Device (bootZA, kernel 6bc86152, native-ufs-probe=10): the panel reported NATIVE_UFS root check, userdata first=3f13a8 last=1d197fa, block0 magic f79c330c 8476b30b ext4magic=8c24 ext4blocks=405 3431726, manifest status=1 windows=0. The controller hand-off, the command path, the GPT parse and a block read work on the phone; status=1 is no SHNGROOT manifest because no userdata image has been written yet, so there are no root windows to publish."]
completion = ["The UFS host enumerates, the OS window mounts read-only and launchd starts; Data persists."]
limits = ["The image has not run: no device was attached when it was built (2026-11-10 12:17), so nothing on this route is measured on hardware yet.", "Unverified reads: CONFIG_XNU_VERIFIED_ROOT_PROBE is off, and the signed policies plus the userdata image that the verified chain needs are still missing.", "The SM8250 SoC repository and ShengUfs are pinned as local working trees in the Git-ignored local.toml; feeds.toml still names the published revisions."]
next_action = ["fastboot boot instantnoodlep-artifacts/bootZ.img (boot only, never flash), photograph the panel and record which milestone the driver reaches: controller map, DMA, first command, capacity/GPT, or media publication.", "Once the controller hand-off is measured, build the signed policies from the OS/SystemOS images and enable CONFIG_XNU_VERIFIED_ROOT_PROBE to publish the authenticated root."]
evidence = [{ kind = "source", reference = "docs/evidence/2026-11-10-storage-route.md", result = "Board measurements and the SM8550 to kona delta for the controller, PHY, GCC branches, core_reset and the missing SMMU." },
{ kind = "source", reference = "docs/evidence/2026-11-10-storage-table-build.md", result = "The four wiring changes, their repositories, the first build result and the link wall." },
{ kind = "source", reference = "docs/evidence/2026-11-10-storage-link.md", result = "How the storage family ABI is bound for 21H461, the unverified compile variant, the artefacts and the pending device test." },
{ kind = "host", reference = "docs/evidence/2026-11-10-storage-link.md", command = "python3 ./unixnu build kernel -D ../UniXNU-instantnoodlep && python3 ./unixnu build payload --kernel <AMFI-patched> && mkbootimg", revision = "40a58ae0d842d8e908e831c1ba0fb40334bd3c6b", result = "libShengUfs.a 1b6bce6e..., kernel.macho 82e653af... (driver linked), payload bbb7580b..., bootZ.img cea799d1... (107,507,712 bytes)." }, { kind = "device", reference = "docs/evidence/2026-11-10-storage-link.md", command = "fastboot boot instantnoodlep-artifacts/bootZA.img", result = "NATIVE_UFS root check: userdata first=3f13a8 last=1d197fa, block0 magic read back, manifest status=1 windows=0 (no userdata image written yet).", revision = "2b5054690df83770ee96ceec7c9ed90e91c3a003" }]

[[area]]
id = "display"
status = "working"
components = ["GopFramebuffer"]
paths = ["kits/**", "package/LegacyDisplayProbe.cpp", "drivers/GopFramebuffer/**"]
inputs = ["Panel qcom,mdss_dsi_oppo19811_samsung_1440_3168_dsc_cmd, 1440x3168 DSC command mode.", "MDSS 0xae00000, DSI0 0xae94000, Pixelworks Iris bridge.", "UEFI GOP framebuffer at 0x9c000001: 1080x2376, stride 4320, 32 bpp; the low bit of the video base is a flag and the scanout lives at the page base."]
configuration = ["GopFramebuffer NativeLegacyDisplay adopts the original IOMobileFramebufferLegacy path; boot-args video=0x9c000001, offline-legacy-console=1, sheng-vsync=60.", "The binding framebuffer format is 8-bit BGRA (fmt=42475241): the backboardd preference CAEnableDeepFramebuffer=false is written before launchd (kernel patch zzz-sm8250-backboard-sdr-prepare.patch) and CA_DISABLE_FRAMEBUFFER_COMPRESSION=1 is injected into backboardd's exec environment (zzz-sm8250-backboard-linear-env.patch)."]
procedure = ["Build the kernel, pack the payload, fastboot boot bootEU.img, capture COM14 and check the DISPLAY/swap/copy-timing lines."]
findings = ["The 480 s diagnostics capture (2026-11-15 21:00) shows 402 frames submitted as fmt=42475241 (BGRA); no 30RGBLE_8A (0x62336138) surface appears after the SDR preference.", "swap accepted=6, rejected=0, verify_swap failed=0; copy timing ranges from 73,936 to 9,641,233 ticks for a full 10,264,320-byte frame, most frames 3.0-3.4M ticks.", "Touch (s6sy791 67 lines) and userland presentation stay healthy while the GPU clients run; no panic in the capture."]
completion = ["A known frame appears with correct geometry and colors, then userland presentation works."]
limits = ["The scanout copy is still CPU-side; full-frame copies cost 3-9.6M ticks and the GPU presenter/handoff path is not wired to the display yet.", "Biplanar/10-bit surfaces are accepted only for compatibility; the 8-bit BGRA path is the supported one."]
next_action = ["Wire the GPU presenter (NativeGOPPresenter / handoff methods 0x7000+) so the frame copy leaves the CPU.", "Record a per-frame timing baseline for static and animated scenes after the presenter."]
evidence = [{ kind = "source", reference = "docs/evidence/2026-11-15-gpu-metal-audit.md", result = "BGRA swap and copy-timing counts from the 480 s capture; kernel 84fe7219/f9dd5770." }]
