version = 1
[boot]
timeout = 60
default = "xnu"
[kits]
autoload = false
[[entry]]
id = "xnu"
title = "UniXNU"
type = "xnu"
path = "Payloads/kernel.macho"
initrd = "Payloads/scratch-data.img"
args = "serial=3 debug=0x14e -no_slto_panic sheng-aks=1 offline-key-events=1 sheng-aks-sls=3 amfi_get_out_of_my_way=1 native-ufs-root=1 native-ufs-allow-unverified=1 root-unverified=1 qcom-usb-debug=1 kt_fixed_zones=120 cpu-features=1 gpu-addon=1 sheng-gpu-addon=1 sheng-pmgr=2 sheng-smp=1 vm_compressor=2 ml-timeout-lock-panic-scale=40 disable-watchdogd=1 sheng-crashlog=1 log=1 data-persist=2 sheng-data-fua=1 native-vroot-cache=1 setup-skip=0 touchscreen=1 sheng-touch-hid=1 backlight=1 accel_stub=0 offline-legacy-register=1 offline-legacy-gop=1 offline-legacy-unit-scale=2 offline-legacy-pm=1 offline-legacy-validate=1 offline-legacy-transfer=1 offline-legacy-cpu-present=1 offline-legacy-retire=1 offline-legacy-phase=4 offline-legacy-adopt=1 sheng-vsync=60 sheng-vsync-fixed=1 offline-mobile-graphics-load=1 offline-mobile-graphics-client=1 launchd_unsecure_cache=1 boot-ui-trace=1 gpu-metal=1 smgop=1 sm8250-gpu-alioth=12 sheng-fb-gpu=1 sheng-early-retire=1 offline-legacy-console=1"
[[entry]]
id = "reset"
title = "Restart"
type = "action"
action = "reset"
[[entry]]
id = "shutdown"
title = "Power off"
type = "action"
action = "shutdown"
