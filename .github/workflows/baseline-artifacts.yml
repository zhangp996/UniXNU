name: baseline-artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - r2/**
      - .github/workflows/baseline-artifacts.yml

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify all split artifacts
        run: sh tools/join-artifacts.sh

  macos-userspace:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Host tools
        run: |
          brew install llvm lld mtools dtc unifdef || true
      - name: Lay out the R2 workspace
        run: |
          mkdir -p "$HOME/unixnu"
          cp -a r2/core "$HOME/unixnu/UniXNU"
          cp -a r2/device "$HOME/unixnu/UniXNU-instantnoodlep"
          rm -rf "$HOME/unixnu/UniXNU/out"
      - name: Build Turnip (Mesa freedreno Vulkan, ios target)
        run: |
          cd "$HOME/unixnu/UniXNU"
          python3 scripts/build-turnip-darwin.py --target ios
      - name: Build the owner-signed Metal plugin and probe daemon
        run: |
          cd "$HOME/unixnu/UniXNU"
          python3 scripts/build-adreno-metal-plugin.py
      - name: Build Setup-skipped and GPU-plugin Data seeds (hdiutil)
        run: |
          cd "$HOME/unixnu/UniXNU"
          SEED="$HOME/unixnu/UniXNU-instantnoodlep/seeds/owner-data-3g.dbr"
          mkdir -p build/macos-seeds
          python3 scripts/seed-data-skip-setup.py "$SEED" build/macos-seeds/data-skip-setup.dbr || echo "skip-setup seed failed"
          python3 scripts/add-gpu-plugin-data.py --publish build/macos-seeds/data-skip-setup.dbr build/macos-seeds/owner-data-gpu.dbr || echo "gpu seed failed"
      - name: Upload macOS-only artifacts
        uses: actions/upload-artifact@v4
        with:
          name: macos-userspace
          path: |
            /Users/runner/unixnu/UniXNU/build/adreno-metal-plugin/**
            /Users/runner/unixnu/UniXNU/build/mesa-tu-ios/**/libvulkan_freedreno.dylib
            /Users/runner/unixnu/UniXNU/build/macos-seeds/*.dbr
          if-no-files-found: warn
