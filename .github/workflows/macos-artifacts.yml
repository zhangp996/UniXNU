name: macos-artifacts

on:
  workflow_dispatch:
  push:
    paths:
      - artifacts/original/**
      - component/AdrenoMetal/**
      - .github/workflows/macos-artifacts.yml

jobs:
  verify-image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the original boot image
        run: sh tools/join-artifacts.sh

  macos-artifacts:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - name: Reassemble and verify the original boot image
        run: sh tools/join-artifacts.sh
      - name: Install GNU coreutils shasum compatibility and tools
        run: brew install llvm dtc || true
      - name: Build macOS-only Metal addon (when its sources are present)
        if: hashFiles('component/AdrenoMetal/**') != ''
        run: |
          set -e
          mkdir -p artifacts/macos
          if [ -x component/AdrenoMetal/build-macos.sh ]; then
            bash component/AdrenoMetal/build-macos.sh
          else
            echo "component/AdrenoMetal has no build-macos.sh; compile the plugin per docs"
            exit 1
          fi
      - name: Upload validated boot image and macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts
          path: |
            artifacts/original/bootEU.img
            artifacts/macos/**
          if-no-files-found: warn
