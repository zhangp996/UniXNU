name: driverkit-iig

# Apple's iig (part of Xcode) turns iokit/DriverKit/*.iig into the *.iig.cpp
# implementations the kernel links against.  It only runs on macOS, so this
# workflow generates them on a GitHub-hosted macOS runner and uploads them as
# an artifact; scripts/install-iig-output.sh feeds them back into the Linux
# build.

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/driverkit-iig.yml'

permissions:
  contents: read

jobs:
  generate:
    runs-on: macos-14
    timeout-minutes: 45
    env:
      XNU_TAG: xnu-10063.141.1
    steps:
      - name: Check out XNU
        uses: actions/checkout@v4
        with:
          repository: apple-oss-distributions/xnu
          ref: ${{ env.XNU_TAG }}
          path: xnu
          fetch-depth: 1

      - name: Show the toolchain
        working-directory: xnu
        run: |
          xcodebuild -version
          xcrun --sdk macosx --show-sdk-path
          xcrun --find iig

      - name: Generate the DriverKit implementations
        working-directory: xnu
        run: |
          set -o pipefail

          # The supported way: let XNU's own build drive iig exactly as it does
          # on a developer machine.
          export SDKROOT=macosx ARCH_CONFIGS=ARM64 MACHINE_CONFIGS=BCM2837 KERNEL_CONFIGS=DEVELOPMENT
          export OBJROOT="$PWD/build/obj" SYMROOT="$PWD/build/sym" DSTROOT="$PWD/build/dst"
          make installhdrs MAKEJOBS=-j"$(sysctl -n hw.ncpu)" 2>&1 | tail -40 || true

          find build -name '*.iig.cpp' -print | sort > /tmp/iig.txt
          echo "generated by make: $(wc -l < /tmp/iig.txt)"

          # Fallback: drive iig directly if the build did not get that far.
          if [ ! -s /tmp/iig.txt ]; then
            mkdir -p iig-out
            SDK=$(xcrun --sdk macosx --show-sdk-path)
            for f in iokit/DriverKit/*.iig; do
              n=$(basename "$f" .iig)
              xcrun iig --def "$f" --header "iig-out/$n.h" --impl "iig-out/$n.iig.cpp" --framework-name DriverKit -- -I iokit -I osfmk -I bsd -isysroot "$SDK" -x c++ -std=gnu++2b -D__IIG=1 -DDRIVERKIT_PRIVATE=1 || echo "iig failed for $n"
            done
            find iig-out -name '*.iig.cpp' -print | sort > /tmp/iig.txt
            echo "generated by direct iig: $(wc -l < /tmp/iig.txt)"
          fi

          test -s /tmp/iig.txt

      - name: Upload the generated implementations
        uses: actions/upload-artifact@v4
        with:
          name: driverkit-iig-cpp
          path: |
            xnu/build/**/*.iig.cpp
            xnu/iig-out/**/*.iig.cpp
          if-no-files-found: error
          retention-days: 30
