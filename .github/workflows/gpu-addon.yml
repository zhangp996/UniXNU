name: GPU addon (macOS)

# Builds this board's own GPU userspace addon (Turnip with the Darwin KMD backend, the NativeAdrenoMetal plugin and
# its metal2vulkan bridge) on the same macOS image the kernel job uses, and publishes build/gpuaddon.bin.
#
# Every external source is taken at the commit recorded in scripts/data/*inputs.json, and the recorded Mesa patches
# are applied in the recorded order; mesa_patch_identity.validate_recorded_patches then verifies both before use.

on:
  workflow_dispatch:
    inputs:
      target:
        description: OS target (ios = iPadOS 17, ios27 = iPadOS 27)
        type: choice
        options: [ios, ios27]
        default: ios
      xcode:
        description: Xcode version of the macos-26 image
        required: true
        default: "26.6"

permissions:
  contents: read

concurrency:
  group: gpu-addon-${{ github.ref }}-${{ inputs.target }}
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  addon:
    runs-on: macos-26
    timeout-minutes: 300
    env:
      DEVELOPER_DIR: /Applications/Xcode_${{ inputs.xcode }}.app/Contents/Developer
      TARGET: ${{ inputs.target }}
    steps:
      - name: Check out UniXNU
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Lay out the R2 baseline framework
        run: rsync -a --exclude .git --exclude out --exclude build r2/core/ ./

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.13"

      - name: Install host tools
        run: brew install llvm lld glslang shaderc meson ninja

      - name: Install the pinned Rust toolchain
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs -o "$RUNNER_TEMP/rustup.sh"
          sh "$RUNNER_TEMP/rustup.sh" -y --profile minimal --default-toolchain 1.98.0
          echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
          "$HOME/.cargo/bin/cargo" --version

      - name: Fetch the pinned Mesa source and apply the recorded patches
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          pins = json.loads(pathlib.Path('scripts/data/adreno-compiler-inputs.json').read_text())
          mesa = pins['mesa']
          work = pathlib.Path('.cache/mesa-work')
          work.parent.mkdir(parents=True, exist_ok=True)
          if not (work / '.git').is_dir():
              subprocess.run(['git', 'init', '-q', str(work)], check=True)
              subprocess.run(['git', '-C', str(work), 'remote', 'add', 'origin', mesa['mirror']], check=True)
          subprocess.run(['git', '-C', str(work), 'fetch', '--depth', '1', 'origin', mesa['commit']], check=True)
          subprocess.run(['git', '-C', str(work), 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
          head = subprocess.check_output(['git', '-C', str(work), 'rev-parse', 'HEAD'], text=True).strip()
          if head != mesa['commit']:
              raise SystemExit('fetched Mesa is ' + head + ', expected ' + mesa['commit'])
          applied = 0
          for patch in pins['patches']:
              path = pathlib.Path(patch).resolve()
              if not path.is_file():
                  raise SystemExit('missing recorded patch: ' + patch)
              # The recorded patches are hand-edited: some create a file from /dev/null without the
              # 'new file mode' / 'index' lines git apply needs, so fall back to patch(1) for those.
              git = subprocess.run(['git', '-C', str(work), 'apply', '--whitespace=nowarn', str(path)],
                                   capture_output=True, text=True)
              if git.returncode != 0:
                  fix = subprocess.run(['patch', '-p1', '-N', '-f', '-s', '-d', str(work), '-i', str(path)],
                                       capture_output=True, text=True)
                  if fix.returncode != 0:
                      raise SystemExit('patch failed: ' + patch + ': ' + (git.stderr or '') + (fix.stderr or ''))
              applied += 1
          print(str(applied) + ' recorded patches applied to ' + head)
          PY

      - name: Fetch the pinned metal2vulkan translator
        run: |
          python3 - <<'PY'
          import json, pathlib, subprocess
          pin = json.loads(pathlib.Path('scripts/data/gpu-metal-vulkan-inputs.json').read_text())['translator']
          work = pathlib.Path('.cache/gpu-reference/metal2vulkan')
          work.parent.mkdir(parents=True, exist_ok=True)
          if not (work / '.git').is_dir():
              subprocess.run(['git', 'init', '-q', str(work)], check=True)
          subprocess.run(['git', '-C', str(work), 'fetch', '--depth', '1', pin['repository'], pin['commit']], check=True)
          subprocess.run(['git', '-C', str(work), 'checkout', '-q', '--detach', 'FETCH_HEAD'], check=True)
          head = subprocess.check_output(['git', '-C', str(work), 'rev-parse', 'HEAD'], text=True).strip()
          if head != pin['commit']:
              raise SystemExit('fetched metal2vulkan is ' + head + ', expected ' + pin['commit'])
          print('metal2vulkan at ' + head)
          PY

      - name: Build the pinned bison
        run: |
          python3 - <<'PY'
          import hashlib, json, os, pathlib, subprocess, tarfile, urllib.request
          pins = json.loads(pathlib.Path('scripts/data/adreno-compiler-inputs.json').read_text())
          b = pins['bison']
          cache = pathlib.Path('.cache')
          cache.mkdir(exist_ok=True)
          tarball = cache / pathlib.Path(b['url']).name
          if not tarball.is_file():
              urllib.request.urlretrieve(b['url'], tarball)
          digest = hashlib.sha256(tarball.read_bytes()).hexdigest()
          if digest != b['sha256']:
              raise SystemExit('bison tarball checksum mismatch: ' + digest)
          src = cache / ('bison-' + b['version'])
          if not src.is_dir():
              tarfile.open(tarball).extractall(cache)
          prefix = cache / 'bison-install'
          env = dict(os.environ, MAKEINFO='true')
          if not (prefix / 'bin' / 'bison').is_file():
              subprocess.run(['./configure', '--prefix=' + str(prefix.resolve()), '--disable-nls'],
                             cwd=str(src), env=env, check=True)
              subprocess.run(['make', '-j4'], cwd=str(src), env=env, check=True)
              subprocess.run(['make', 'install'], cwd=str(src), env=env, check=True)
          tools = cache / 'mesa-tools' / 'bin'
          tools.mkdir(parents=True, exist_ok=True)
          link = tools / 'bison'
          if link.is_symlink() or link.exists():
              link.unlink()
          link.symlink_to((prefix / 'bin' / 'bison').resolve())
          print(subprocess.check_output([str(link), '--version'], text=True).splitlines()[0])
          PY

      - name: Prepare the compiler toolchain environment
        run: |
          python3 -m venv .cache/mesa-venv
          .cache/mesa-venv/bin/pip install --quiet --upgrade pip
          .cache/mesa-venv/bin/pip install --quiet -r scripts/requirements-adreno-compiler.txt
          .cache/mesa-venv/bin/meson --version
          mkdir -p .cache/mesa-tools/bin
          ln -sf "$(command -v glslangValidator)" .cache/mesa-tools/bin/glslangValidator
          ln -sf "$(command -v glslc)" .cache/mesa-tools/bin/glslc

      - name: Build Turnip with the Darwin KMD backend
        run: python3 scripts/build-turnip-darwin.py --target "$TARGET"

      - name: Build the NativeAdrenoMetal plugin
        run: python3 scripts/build-adreno-metal-plugin.py --target "$TARGET" --no-replay

      - name: Pack the addon
        run: |
          python3 scripts/make-gpu-addon.py --publish build/gpuaddon.bin
          ls -la build/gpuaddon.bin
          shasum -a 256 build/gpuaddon.bin

      - name: Upload the addon
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gpu-addon-${{ inputs.target }}
          path: |
            build/gpuaddon.bin
          if-no-files-found: warn
          retention-days: 7
